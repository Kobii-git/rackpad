server {
  listen 80;
  server_name rackpad.example.com;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl http2;
  server_name rackpad.example.com;

  ssl_certificate /etc/letsencrypt/live/rackpad.example.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/rackpad.example.com/privkey.pem;
  ssl_session_timeout 1d;
  ssl_session_cache shared:RackpadSSL:10m;
  ssl_session_tickets off;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;

  client_max_body_size 50m;

  location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_read_timeout 60s;
  }
}
