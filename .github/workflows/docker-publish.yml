name: docker-publish

on:
  push:
    branches: [main, beta, dev]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main, beta, dev]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  quality:
    uses: ./.github/workflows/quality.yml
    permissions:
      contents: read

  codeql:
    uses: ./.github/workflows/codeql.yml
    permissions:
      actions: read
      contents: read
      security-events: write

  security:
    uses: ./.github/workflows/security-scan.yml
    permissions:
      actions: read
      contents: read
      packages: read
      security-events: write

  build:
    needs: [quality, codeql, security]
    runs-on: ubuntu-latest
    outputs:
      prerelease: ${{ steps.release-contract.outputs.prerelease }}
      digest: ${{ steps.image-build.outputs.digest }}
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Fetch release branches
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main +refs/heads/beta:refs/remotes/origin/beta

      - name: Validate release contract
        id: release-contract
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: node scripts/check-release-contract.mjs

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          labels: |
            org.opencontainers.image.title=Rackpad
            org.opencontainers.image.description=Self-hosted homelab and lab inventory: racks, ports, cables, IPs, devices.
            org.opencontainers.image.url=https://github.com/Kobii-git/Rackpad
            org.opencontainers.image.source=https://github.com/Kobii-git/Rackpad
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.event_name != 'pull_request' && (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || (startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-'))) }}

      - name: Build and push
        id: image-build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
          build-args: |
            RACKPAD_BUILD_CHANNEL=${{ github.ref_name }}
          pull: true
          no-cache-filters: runtime
          cache-from: type=gha
          cache-to: type=gha,mode=max

  candidate-smoke:
    name: Pre-merge image smoke (${{ matrix.platform }})
    needs: [quality, codeql, security]
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [linux/amd64, linux/arm64]
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build unpublished candidate
        id: candidate
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          load: true
          push: false
          tags: rackpad:release-candidate
          labels: org.opencontainers.image.revision=${{ github.sha }}
          build-args: RACKPAD_BUILD_CHANNEL=candidate
          pull: true
          no-cache-filters: runtime
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify stable and beta upgrades with paired rollback
        env:
          CANDIDATE_IMAGE: ${{ steps.candidate.outputs.imageid }}
          PLATFORM: ${{ matrix.platform }}
          # Immutable v1.8.3/schema-51 and beta/schema-53 baselines.
          STABLE_IMAGE: ghcr.io/kobii-git/rackpad@sha256:6a4fce729eef6bf380cfcc5a9e2be3daad914686ff04c2f9b85904528a6cf94e
          # v1.8.7-beta.0, revision 7bf2eaf484daa5c878154a5d1f828528daff7bff.
          SCHEMA57_IMAGE: ghcr.io/kobii-git/rackpad@sha256:a9652c980a17ae0ce4638492402d1cab54f876a3b6901bd8cf906eed18889ff5
          SCHEMA55_IMAGE: ghcr.io/kobii-git/rackpad@sha256:ea8076a73ee49e150abcf8326baf79cd79a8741499090f0111b164454e0ccbba
          BETA_IMAGE: ghcr.io/kobii-git/rackpad@sha256:42e503856315781bf2b8c640a8505687a07d7d3500534fa1ef767f1071c795c4
        run: |
          node scripts/check-release-image.mjs --image "$CANDIDATE_IMAGE" --previous-image "$STABLE_IMAGE" --previous-schema 51 --platform "$PLATFORM" --revision "$GITHUB_SHA"
          node scripts/check-release-image.mjs --image "$CANDIDATE_IMAGE" --previous-image "$BETA_IMAGE" --previous-schema 53 --platform "$PLATFORM" --revision "$GITHUB_SHA"
          node scripts/check-release-image.mjs --image "$CANDIDATE_IMAGE" --previous-image "$SCHEMA55_IMAGE" --previous-schema 55 --platform "$PLATFORM" --revision "$GITHUB_SHA"
          node scripts/check-release-image.mjs --image "$CANDIDATE_IMAGE" --previous-image "$SCHEMA57_IMAGE" --previous-schema 57 --platform "$PLATFORM" --revision "$GITHUB_SHA"

  smoke:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [linux/amd64, linux/arm64]
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout smoke checks
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify published revision, fresh install and upgrade
        env:
          IMAGE_DIGEST: ${{ needs.build.outputs.digest }}
          PLATFORM: ${{ matrix.platform }}
          # Immutable schema-53 beta baseline; never resolve a moving tag here.
          # v1.8.7-beta.0, revision 7bf2eaf484daa5c878154a5d1f828528daff7bff.
          SCHEMA57_IMAGE: ghcr.io/kobii-git/rackpad@sha256:a9652c980a17ae0ce4638492402d1cab54f876a3b6901bd8cf906eed18889ff5
          SCHEMA55_IMAGE: ghcr.io/kobii-git/rackpad@sha256:ea8076a73ee49e150abcf8326baf79cd79a8741499090f0111b164454e0ccbba
          PREVIOUS_IMAGE: ghcr.io/kobii-git/rackpad@sha256:42e503856315781bf2b8c640a8505687a07d7d3500534fa1ef767f1071c795c4
        run: |
          image_name="${IMAGE_NAME,,}"
          node scripts/check-release-image.mjs \
            --image "${REGISTRY}/${image_name}@${IMAGE_DIGEST}" \
            --previous-image "$PREVIOUS_IMAGE" \
            --platform "$PLATFORM" \
            --revision "$GITHUB_SHA"
          node scripts/check-release-image.mjs --image "${REGISTRY}/${image_name}@${IMAGE_DIGEST}" --previous-image "$SCHEMA55_IMAGE" --previous-schema 55 --platform "$PLATFORM" --revision "$GITHUB_SHA"
          node scripts/check-release-image.mjs --image "${REGISTRY}/${image_name}@${IMAGE_DIGEST}" --previous-image "$SCHEMA57_IMAGE" --previous-schema 57 --platform "$PLATFORM" --revision "$GITHUB_SHA"

  release:
    needs: [build, smoke]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout release notes
        uses: actions/checkout@v7

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          IS_PRERELEASE: ${{ needs.build.outputs.prerelease }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            existing_prerelease="$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json isPrerelease --jq '.isPrerelease')"
            if [[ "$existing_prerelease" != "$IS_PRERELEASE" ]]; then
              echo "Existing release prerelease status does not match the validated tag." >&2
              exit 1
            fi
            echo "GitHub Release $GITHUB_REF_NAME already exists with the expected type."
            exit 0
          fi

          release_args=(
            release create "$GITHUB_REF_NAME"
            --repo "$GITHUB_REPOSITORY"
            --verify-tag
            --title "Rackpad $GITHUB_REF_NAME"
            --notes-file "docs/releases/${GITHUB_REF_NAME}.md"
          )
          if [[ "$IS_PRERELEASE" == "true" ]]; then
            release_args+=(--prerelease)
          fi
          gh "${release_args[@]}"
