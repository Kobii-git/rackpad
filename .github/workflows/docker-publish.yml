name: docker-publish

on:
  push:
    branches: [main, beta, dev]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main, beta, dev]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  quality:
    uses: ./.github/workflows/quality.yml
    permissions:
      contents: read

  build:
    needs: quality
    runs-on: ubuntu-latest
    outputs:
      prerelease: ${{ steps.release-contract.outputs.prerelease }}
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Fetch release branches
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main +refs/heads/beta:refs/remotes/origin/beta

      - name: Validate release contract
        id: release-contract
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: node scripts/check-release-contract.mjs

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          labels: |
            org.opencontainers.image.title=Rackpad
            org.opencontainers.image.description=Self-hosted homelab and lab inventory: racks, ports, cables, IPs, devices.
            org.opencontainers.image.url=https://github.com/Kobii-git/Rackpad
            org.opencontainers.image.source=https://github.com/Kobii-git/Rackpad
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.event_name != 'pull_request' && (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || (startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-'))) }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
          build-args: |
            RACKPAD_BUILD_CHANNEL=${{ github.ref_name }}
          pull: true
          no-cache-filters: runtime
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          IS_PRERELEASE: ${{ needs.build.outputs.prerelease }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            existing_prerelease="$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json isPrerelease --jq '.isPrerelease')"
            if [[ "$existing_prerelease" != "$IS_PRERELEASE" ]]; then
              echo "Existing release prerelease status does not match the validated tag." >&2
              exit 1
            fi
            echo "GitHub Release $GITHUB_REF_NAME already exists with the expected type."
            exit 0
          fi

          release_args=(
            release create "$GITHUB_REF_NAME"
            --repo "$GITHUB_REPOSITORY"
            --verify-tag
            --title "Rackpad $GITHUB_REF_NAME"
            --generate-notes
          )
          if [[ "$IS_PRERELEASE" == "true" ]]; then
            release_args+=(--prerelease)
          fi
          gh "${release_args[@]}"
