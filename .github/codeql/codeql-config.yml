name: "Rackpad CodeQL config"

paths-ignore:
  - server/tests/**

query-filters:
  # Fastify applies one global @fastify/rate-limit policy in server/app.ts.
  # CodeQL does not currently model that plugin registration. Review this
  # repository-wide query exception by 2026-11-30.
  - exclude:
      id: js/missing-rate-limiting
