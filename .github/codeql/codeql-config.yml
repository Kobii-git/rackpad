name: "Rackpad CodeQL config"

paths-ignore:
  - server/tests/**

query-filters:
  # Fastify applies one global @fastify/rate-limit policy in server/app.ts.
  # CodeQL does not currently model that plugin registration and reports every
  # protected route separately. Owner: @Kobii-git. Compensating controls:
  # runtime cross-route/proxy-identity tests plus an ESLint rule and lint:proof
  # probe that prevent a second Fastify app from bypassing the global plugin.
  # Expiry/review date: 2026-11-30.
  - exclude:
      id: js/missing-rate-limiting
